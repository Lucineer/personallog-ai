name = "personallog-ai"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

[vars]
PROVIDER = "deepseek"
MODEL = "deepseek-chat"
MAX_MEMORIES = "1000"
GUEST_LIMIT = "5"

[[kv_namespaces]]
binding = "MEMORY"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_ID"

[env.production]
name = "personallog-ai"
routes = [
  { pattern = "personallog.ai", custom_domain = true }
]

[[env.production.kv_namespaces]]
binding = "MEMORY"
id = "YOUR_PRODUCTION_KV_ID"

[env.preview]
name = "personallog-ai-preview"
